[project]
name = "sre-copilot"
version = "0.1.0"
description = "AI SRE copilot: understands incidents, investigates root cause and proposes safe, approval-gated remediation."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "kubernetes>=30.1",
  "asyncssh>=2.14",
  "cryptography>=42",
  "pyyaml>=6",
  "sse-starlette>=2.1",
  "langchain-core>=0.3",
  "langgraph>=0.2",
  "langchain-openai>=0.2",
  "langchain-anthropic>=0.2",
  "langchain-ollama>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

# Third-party plugins register themselves here, e.g.:
# [project.entry-points."sre_copilot.plugins"]
# datadog = "my_pkg.datadog:DatadogMonitoring"
[project.entry-points."sre_copilot.plugins"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
