apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sre-copilot.fullname" . }}-bootstrap
  labels: {{- include "sre-copilot.labels" . | nindent 4 }}
data:
  integrations.yaml: |
{{ toYaml .Values.bootstrap | indent 4 }}
{{- if not .Values.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sre-copilot.fullname" . }}
  labels: {{- include "sre-copilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sre-copilot.fullname" . }}-data
  labels: {{- include "sre-copilot.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.persistence.size }} } }
{{- end }}
